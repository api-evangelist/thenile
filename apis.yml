aid: thenile
name: Nile
description: Nile is a serverless PostgreSQL platform re-engineered for multi-tenant
  B2B applications, offering virtual tenant databases, tenant isolation, vector embeddings,
  and built-in user and tenant authentication (Nile Auth). Its control-plane REST
  API manages workspaces, databases, credentials, regions and billing, a database
  API manages tenants, users and OIDC providers, and a regional auth API powers sign-in,
  sessions and tenant membership.
