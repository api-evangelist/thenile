openapi: 3.2.0
info:
  title: Thenile Users API
  version: '1.0'
  description: 'Operations tagged users across 4 of this provider''s published API definitions: api-openapi.json, us-west-2-auth-openapi.yaml, thenile-auth-openapi.yml, thenile-database-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://global.thenile.dev
- url: https://us-west-2.api.thenile.dev
  description: Regional Nile API host that serves this spec at /v2/openapi (listed in https://thenile.dev/docs/llms.txt)
tags:
- name: Users
paths:
  /workspaces/{workspaceSlug}/databases/{databaseName}/tenants/{tenantId}/auth/oidc/callback:
    get:
      tags:
      - Users
      summary: Handle OIDC callback for a tenant user
      description: Handles the callback from an OIDC provider for a specific tenant. (This is the URL provided to the OIDC provider as the callback URL.)
      operationId: globalHandleTenantOIDCCallback
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          minLength: 1
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A form post to the configured redirect URL
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/OIDCFormPostView'
    servers:
    - url: https://global.thenile.dev
  /workspaces/{workspaceSlug}/databases/{databaseName}/tenants/{tenantId}/users:
    get:
      tags:
      - Users
      summary: List tenant users
      description: Lists users that are associated with the specified tenant.
      operationId: globalListTenantUsers
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Users found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    post:
      tags:
      - Users
      summary: Create a user in a tenant
      description: Creates a new user and associates that user with the specified tenant.
      operationId: globalCreateTenantUser
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: 'The email and password combination the user will use to authenticate.

          The `name` is optional; if provided it will be recorded in the `users` table.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBasicUserRequest'
            examples:
              Create User Request:
                summary: Creates a user with basic credentials
                description: Create User Request
                value:
                  email: a.user@somedomain.com
                  password: somepassword
                  name: A. User
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUserResponse'
      security:
      - jwtBearerAuth: []
    servers:
    - url: https://global.thenile.dev
  /workspaces/{workspaceSlug}/databases/{databaseName}/tenants/{tenantId}/users/{userId}:
    get:
      tags:
      - Users
      summary: Get a user in a tenant
      description: Gets information about a user, but only if that user belongs to the tenant specified. If the user does not belong to the tenant, this returns 404 (Not Found).
      operationId: globalGetTenantUser
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    servers:
    - url: https://global.thenile.dev
  /workspaces/{workspaceSlug}/databases/{databaseName}/tenants/{tenantId}/users/login:
    post:
      tags:
      - Users
      summary: Login a user in a tenant
      description: Authenticates a user, ensuring that the user is a member of the tenant. If the user is not a member of the tenant, this returns 401 (Unauthorized).
      operationId: globalLoginTenantUser
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: The email and password combination the user registered with.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Login Request:
                description: Login Request
                value:
                  email: a.user@somedomain.com
                  password: somepassword
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUserResponse'
        '401':
          description: User authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    servers:
    - url: https://global.thenile.dev
  /workspaces/{workspaceSlug}/databases/{databaseName}/users/{userId}:
    get:
      tags:
      - Users
      summary: Get a user
      description: Gets a user by id.
