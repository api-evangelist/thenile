  /workspaces/{workspaceSlug}/databases/{databaseName}/users/oidc/{providerName}/login:
    get:
      tags:
      - Users
      summary: Initiate OIDC user login
      description: Initiates the OIDC login flow for a known authentication provider.
      operationId: globalLoginOIDCUser
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: providerName
        in: path
        required: true
        schema:
          type: string
      - name: newTenant
        in: query
        schema:
          type: string
      - name: nonce
        in: query
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the provider's login page
        '404':
          description: Unknown OIDC provider
    servers:
    - url: https://global.thenile.dev
