      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: redirect_host
        in: query
        schema:
          type: string
      requestBody:
        description: Contact information for the invitee
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
        required: true
      responses:
        '201':
          description: Invite created successfully. An email will be sent.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DeveloperInvite'
                - $ref: '#/components/schemas/DeveloperInviteWithCode'
        '202':
          description: The invite is pending email delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/invites/{inviteId}:
