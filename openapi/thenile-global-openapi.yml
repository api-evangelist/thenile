openapi: 3.0.1
info:
  title: Nile ReST API
  description: Making SaaS chill.
  contact:
    email: support@thenile.dev
  version: 0.1.0-72f73d7
servers:
- url: https://global.thenile.dev
paths:
  /workspaces/{workspaceSlug}/databases/{databaseName}/compute:
    get:
      tags:
      - databases
      - compute
      summary: List dedicated compute instances for a database
      operationId: listComputeForDatabase
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: start
        in: query
        schema:
          type: string
          description: The start of a time window to search for active instances
          format: date-time
      - name: end
        in: query
        schema:
          type: string
          description: The end of a time window to search for active instances
          format: date-time
      responses:
        '200':
          description: Instance list retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DedicatedComputeInstance'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    post:
      tags:
      - databases
      - compute
      summary: Create a dedicated compute instance
      operationId: createComputeInstance
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/CreateComputeInstanceRequest'
        required: true
      responses:
        '200':
          description: Instance created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedComputeInstance'
        '202':
          description: Instance creation pending; poll for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DedicatedComputeInstance'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/databases/{databaseName}/compute/{instanceId}:
    get:
      tags:
      - databases
      - compute
      summary: Describe a dedicated compute instance
      operationId: describeComputeInstance
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Dedicated compute instance details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DedicatedComputeInstance'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    put:
      tags:
      - databases
      - compute
      summary: Update a dedicated compute instance
      description: 'Rename and/or resize a dedicated compute instance.

        '
      operationId: updateComputeInstance
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/UpdateComputeInstanceRequest'
        required: true
      responses:
        '200':
          description: Instance updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseResponse'
        '202':
          description: Instance update pending; poll for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseResponse'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    delete:
      tags:
      - databases
      - compute
      summary: Delete a dedicated compute instance
      description: 'Removes a compute instance from your database and queues it for
        deletion. The

        instance will no longer appear in your Nile dashboard. When deletion is

        finalized, all data associated with the instance will be deleted.

        '
      operationId: deleteComputeInstance
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Instance deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseResponse'
        '202':
          description: Instance deletion pending; poll for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseResponse'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/databases/{databaseName}/credentials:
    get:
      tags:
      - databases
      - authentication
      - credentials
      summary: Lists credentials for a database
      description: 'Lists all credentials that exist for a database. The id of the
        credential is

        included in the response, but not the password. Passwords are provided only
        once,

        at the time the credential is created, and are encrypted for storage.

        '
      operationId: listCredentials
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: query
        schema:
          type: string
      - name: internal
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A list of Credential objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetCredentialResponse'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    post:
      tags:
      - databases
      - authentication
      - credentials
      summary: Create a database credential
      description: 'Generates a new secure credential for a database. The generated
        password is

        returned in the response, and is the only time the password is available in

        plaintext. No request body is required."

        '
      operationId: createCredential
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: query
        schema:
          type: string
      - name: internal
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Credential created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCredentialResponse'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/databases/{databaseName}/credentials/{credentialId}:
    delete:
      tags:
      - databases
      - authentication
      - credentials
      summary: Delete a database credential
      description: 'Deletes an existing database credential. No request body is required."

        '
      operationId: deleteCredential
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Credential deleted
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/databases/{databaseName}/credentials/rotate:
    post:
      tags:
      - databases
      - authentication
      - credentials
      summary: Rotate a database credential
      description: 'Generates a new credential and schedules existing credentials
        for deletion after the provided delay.

        '
      operationId: rotateCredential
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: query
        schema:
          type: string
      - name: internal
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/RotateCredentialRequest'
      responses:
        '200':
          description: New credential after rotation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCredentialResponse'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/databases/claim:
    post:
      tags:
      - databases
      summary: Claim a database provisioned without auth
      description: Moves the database into the selected workspace if the claim database
        session is valid.
      operationId: claimDatabase
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimDatabaseRequest'
        required: true
      responses:
        '200':
          description: Database claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseResponse'
        '400':
          description: The database is not compatible with the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Claim database session is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/databases/{databaseId}/insights/errors:
    get:
      tags:
      - databases
      summary: List database error metrics
      description: Lists bucketed SQL and connection error counts reported by Thoth
        and Nile Proxy.
      operationId: listDatabaseErrorInsights
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: start
        in: query
        schema:
          type: string
          description: Minute-aligned start of the metric window.
          format: date-time
      - name: end
        in: query
        schema:
          type: string
          description: Minute-aligned end of the metric window.
          format: date-time
      - name: granularity
        in: query
        schema:
          type: string
          description: 'Bucket granularity: 1m, 5m, 1h, or 1d.'
      responses:
        '200':
          description: Database error metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseErrorsResponse'
        '400':
          description: Invalid time range or granularity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Database not found in the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '502':
          description: Regional metadata or Tinybird telemetry is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Tinybird telemetry is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/databases/{databaseId}/insights/query-performance:
    get:
      tags:
      - databases
      summary: List database query performance metrics
      description: Lists separately sourced Proxy query rate, Thoth observed query
        rate, and Thoth P99 query latency for a database.
      operationId: listDatabaseQueryPerformanceInsights
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: start
        in: query
        schema:
          type: string
          description: Minute-aligned start of the metric window.
          format: date-time
      - name: end
        in: query
        schema:
          type: string
          description: Minute-aligned end of the metric window.
          format: date-time
      - name: granularity
        in: query
        schema:
          type: string
          description: 'Bucket granularity: 1m, 5m, 1h, or 1d.'
      responses:
        '200':
          description: Database query performance metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseQueryPerformanceResponse'
        '400':
          description: Invalid time range or granularity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Database not found in the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '502':
          description: Regional metadata or Tinybird telemetry is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Tinybird telemetry is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/databases:
    get:
      tags:
      - databases
      summary: List databases
      description: 'Lists all of the databases in a workspace.

        '
      operationId: listDatabases
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of GetDatabaseResponse objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetDatabaseResponse'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    post:
      tags:
      - databases
      summary: Create a database
      description: 'Creates a database record in the control plane and triggers creation
        in the

        target region. Database names must be less than 64 characters, and unique

        within a workspace. Names may contain letters (lower or uppercase), numbers,

        and underscores, and must begin with a letter or underscore.

        '
      operationId: createDatabase
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: The name and region for the new database
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
        required: true
      responses:
        '201':
          description: Database created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseResponse'
        '400':
          description: An invalid database name or region was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: The workspace does not exist or is not authorized for the authenticated
            user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: A database with the provided name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/databases/{databaseName}:
    get:
      tags:
      - databases
      summary: Get a database
      description: 'Gets details of a database.

        '
      operationId: getDatabase
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseResponse'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: No database with that name exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    put:
      tags:
      - databases
      summary: Rename a database
      description: 'Renames a database in a workspace.

        '
      operationId: renameDatabase
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: The new name for the database.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatabaseRequest'
        required: true
      responses:
        '200':
          description: Database renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseResponse'
        '400':
          description: An invalid database name was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: A database with the provided name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    delete:
      tags:
      - databases
      summary: Delete a database
      description: 'Marks a database as deleted and queues its data for deletion.
        The database will

        no longer appear in your Nile dashboard. You will be able to connect to it
        and

        operate on it while it is queued for deletion, but compute costs still apply.

        '
      operationId: deleteDatabase
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Database deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDatabaseResponse'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/databases/{databaseId}/insights/uptime:
    get:
      tags:
      - databases
      summary: List database uptime metrics
      description: Lists time-weighted database uptime derived from PostgreSQL ready-probe
        samples.
      operationId: listDatabaseUptimeInsights
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: start
        in: query
        schema:
          type: string
          description: Minute-aligned start of the metric window.
          format: date-time
      - name: end
        in: query
        schema:
          type: string
          description: Minute-aligned end of the metric window.
          format: date-time
      - name: granularity
        in: query
        schema:
          type: string
          description: 'Bucket granularity: 1m, 5m, 1h, or 1d.'
      responses:
        '200':
          description: Database uptime metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseUptimeResponse'
        '400':
          description: Invalid time range or granularity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Database not found in the workspace.
          content:
            application/json:
              schema:
