      summary: List developer invites
      description: Lists all developer invites in a workspace
      operationId: listDeveloperInvites
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: verificationState
        in: query
        description: Comma-separated email verification states
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - EMAIL_PENDING
            - EMAIL_SENT
            - VERIFIED
            - EXPIRED
      responses:
        '200':
          description: List of invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeveloperInvite'
        '401':
          description: Unauthorized. Credentials were missing or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden. The credentials provided do not grant access to
            the requested resource(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    post:
      tags:
      - developers
      - workspaces
      summary: Invite a developer to a workspace
      description: 'Sends an email to another developer with a link that allows them
        to join the

        workspace.

        '
