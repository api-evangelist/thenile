            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSubscriptionDto'
        '404':
          description: No active subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/subscription/history:
    get:
      tags:
      - workspaces
      summary: List subscription history (most-recent first)
      description: 'List all subscription records for the given workspace, most-recent
        first.

        '
      operationId: getWorkspaceSubscriptionHistory
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Subscription history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceSubscriptionDto'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/billing/{ym}/totals:
