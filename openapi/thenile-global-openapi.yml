      - workspaces
      summary: Monthly totals by component, from rated lines
      operationId: totals
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: ym
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Monthly component totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMonthlyTotalsDto'
      security:
      - jwtBearerAuth: []
  /workspaces/{workspaceSlug}/insights/usage:
    get:
      tags:
      - workspaces
      summary: Get observed workspace usage
      description: Returns month-to-date CPU and provisioned compute usage in UTC,
        and current storage with daily UTC snapshots. Each metric has an independent
        availability status. CPU includes retained identities of databases deleted
        this month. Each storage snapshot includes the databases present at its boundary.
        Flavor 1 only.
      operationId: getWorkspaceUsageInsights
      parameters:
      - name: workspaceSlug
        in: path
        required: true
        schema:
          type: string
      - name: include_compute
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Workspace usage and per-metric availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceUsageResponse'
        '401':
          description: Developer is not a member of this workspace
        '403':
          description: Workspace uses legacy usage metrics
        '404':
          description: Workspace not found
      security:
      - jwtBearerAuth: []
  /oauth2/token:
    post:
      tags:
      - authentication
      summary: Exchange an authorization code or refresh token
      description: Uses OAuth client credentials or a PKCE verifier to exchange an
        authorization code, or refreshes an existing access token.
      operationId: getToken
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                code:
                  type: string
                code_verifier:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                refresh_token:
                  type: string
                scope:
                  type: string
      responses:
        '200':
          description: OAuth access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
components:
  schemas:
    ComputeInstanceType:
      required:
      - computeSize
      - hourlyCost
      - id
      - memory
      type: object
      properties:
        id:
          type: string
        computeSize:
          minLength: 1
          type: string
        memory:
          minLength: 1
          type: string
        hourlyCost:
          type: number
    DatabaseParentResponse:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
        name:
          minLength: 1
          type: string
    DedicatedComputeInstance:
      required:
      - desiredInstanceType
      - instanceId
      - instanceName
      - instanceType
      - status
      type: object
      properties:
        instanceId:
          type: string
        workspace:
          $ref: '#/components/schemas/Workspace'
        database:
          $ref: '#/components/schemas/GetDatabaseResponse'
        region:
          type: string
          enum:
          - AWS_US_WEST_2
          - AWS_US_EAST_1
          - AWS_EU_CENTRAL_1
          - AZURE_EASTUS
        instanceName:
          type: string
        instanceType:
          $ref: '#/components/schemas/ComputeInstanceType'
        desiredInstanceType:
          $ref: '#/components/schemas/ComputeInstanceType'
        status:
          type: string
          enum:
          - PENDING
          - PROVISIONING
          - READY
          - RESIZING
          - DELETING
          - FAILED
          - TERMINATED
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
    GetDatabaseResponse:
      required:
      - expandable
      - id
      - name
      - region
      - status
      - workspace
      type: object
      properties:
        id:
          type: string
        name:
          minLength: 1
          type: string
        workspace:
          $ref: '#/components/schemas/Workspace'
        status:
          type: string
          enum:
          - PENDING
          - REQUESTED
          - BUILT
          - POOLED
          - READY
        region:
          type: string
          enum:
          - AWS_US_WEST_2
          - AWS_US_EAST_1
          - AWS_EU_CENTRAL_1
          - AZURE_EASTUS
        expandable:
          type: boolean
        created:
          type: string
          format: date-time
        deleted:
          type: string
          format: date-time
        apiHost:
          type: string
          description: Public database API URL; Since it is only used for tenants/users
            management, it is null for un-sharded databases.
          format: uri
          nullable: true
        dbHost:
          type: string
          format: uri
        parent:
