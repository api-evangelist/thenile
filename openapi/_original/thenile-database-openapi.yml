      operationId: deleteTenant
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Tenant deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /databases/{databaseId}/tenants:
    get:
      summary: List tenants
      description: Lists all tenants in a database. If a developer token is provided,
        all tenants are listed. If a user token is provided, only tenants that the
        user is a member of are listed.
      operationId: listTenants
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /databases/{databaseId}/tenants/{tenantId}/users:
    get:
      tags:
      - users
      summary: List tenant users
      description: Lists users that are associated with the specified tenant.
      operationId: listTenantUsers
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Users found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    post:
      tags:
      - users
      summary: Create a user in a tenant
      description: Creates a new user and associates that user with the specified
        tenant.
      operationId: createTenantUser
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: 'The email and password combination the user will use to authenticate.

          The `name` is optional; if provided it will be recorded in the `users` table.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBasicUserRequest'
            examples:
              Create User Request:
                summary: Creates a user with basic credentials
                description: Create User Request
                value:
                  email: a.user@somedomain.com
                  password: somepassword
                  name: A. User
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUserResponse'
      security:
      - jwtBearerAuth: []
  /databases/{databaseId}/tenants/{tenantId}/users/{userId}:
    get:
      tags:
      - users
      summary: Get a user in a tenant
      description: Gets information about a user, but only if that user belongs to
        the tenant specified. If the user does not belong to the tenant, this returns
        404 (Not Found).
      operationId: getTenantUser
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /databases/{databaseId}/tenants/{tenantId}/users/login:
    post:
      tags:
      - users
      summary: Login a user in a tenant
      description: Authenticates a user, ensuring that the user is a member of the
        tenant. If the user is not a member of the tenant, this returns 401 (Unauthorized).
      operationId: loginTenantUser
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: The email and password combination the user registered with.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Login Request:
                description: Login Request
                value:
                  email: a.user@somedomain.com
                  password: somepassword
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUserResponse'
        '401':
          description: User authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /databases/{databaseId}/users/{userId}:
    get:
      tags:
      - users
      summary: Get a user
      description: Gets a user by id.
      operationId: getUser
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    put:
      tags:
      - users
      summary: Update a user
      description: Updates user attributes by id.
      operationId: updateUser
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    delete:
      tags:
      - users
      summary: Delete a user
      description: Deletes a user from the database
      operationId: deleteUser
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /databases/{databaseId}/users:
    get:
      tags:
      - users
      summary: List database users
      description: Lists all users in the database
      operationId: listUsers
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Users found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
    post:
      tags:
      - users
      summary: Create a new user
      description: Creates a new user using basic credentials—email address and password.
      operationId: createUser
      requestBody:
        description: 'The email and password combination the user will use to authenticate.

          The `name` is optional; if provided it will be recorded in the `users` table.

          The `newTenant` is optional; if provided, it is used as the name of a new
          tenant record associated with the newly created user.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBasicUserRequest'
            examples:
              Create User Request:
                summary: Creates a user with basic credentials
                description: Create User Request
                value:
                  email: a.user@somedomain.com
                  password: somepassword
                  name: A. User
              Create User Request with Tenant:
                summary: Creates a user and a new tenant for that user
                description: Create User Request with Tenant
                value:
                  email: a.user@somedomain.com
                  password: somepassword
                  name: A. User
                  newTenant: My Sandbox
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUserResponse'
  /databases/{databaseId}/users/oidc/callback:
    get:
      tags:
      - users
      summary: Handle OIDC callback for a user
      description: Handles the callback from an OIDC provider. (This is the URL provided
        to the OIDC provider as the callback URL.)
      operationId: handleOIDCCallbackDP
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          minLength: 1
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A form post to the configured redirect URL
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/OIDCFormPostView'
  /databases/{databaseId}/users/me:
    get:
      tags:
      - users
      summary: Identify the user
      description: Returns information about the user associated with the token provided
      operationId: identifyUser
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /databases/{databaseId}/users/login:
    post:
      tags:
      - users
      summary: Login a user
      description: Login a user with email and password
      operationId: loginUser
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: The email and password combination the user registered with.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Login Request:
                description: Login Request
                value:
                  email: a.user@somedomain.com
                  password: somepassword
      responses:
        '200':
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginUserResponse'
        '401':
          description: User authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /databases/{databaseId}/users/oidc/{providerName}/login:
    get:
      tags:
      - users
      summary: Initiate OIDC user login
      description: Initiates the OIDC login flow for a known authentication provider.
      operationId: loginOIDCUserDP
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: providerName
        in: path
        required: true
        schema:
          type: string
      - name: newTenant
        in: query
        schema:
          type: string
      - name: nonce
        in: query
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the provider's login page
        '404':
          description: Unknown OIDC provider
components:
  schemas:
    APIError:
      required:
      - errorCode
      - message
      - statusCode
      type: object
      properties:
        errorCode:
          type: string
          enum:
          - internal_error
          - bad_request
          - unsupported_operation
          - entity_not_found
          - duplicate_entity
          - invalid_credentials
          - unknown_oidc_provider
          - unknown_oidc_party
          - provider_already_exists
          - provider_config_error
          - provider_mismatch
          - provider_update_error
          - provider_disabled
          - session_state_missing
          - session_state_mismatch
          - oidc_code_missing
          - tenant_not_found
          - constraint_violation
          - sql_exception
          - db_creation_failure
          - db_status_failure
          - db_initialization_failure
          - db_config_missing
          - unauthorized_workspace_access
          - email_send_failure
          - jdbc_exception
          - oidc_exception
          - region_mismatch
          - credential_creation_failure
          - credential_propagation_failure
          - pdb_creation_failure
          - get_pdbs_failure
          - get_ldbs_placed_on_pdb_failure
          - credential_deletion_failure
          - get_ldb_on_pdb_placement_status_failure
          - pdb_deletion_failure
          - missing_flavor_id
        message:
          minLength: 1
          type: string
        statusCode:
          type: integer
          format: int32
    TenantSSORegistration:
      required:
      - clientId
      - configUrl
      - provider
      - tenantId
      type: object
      properties:
        id:
          type: string
          readOnly: true
        tenantId:
          type: string
        provider:
          type: string
        configUrl:
          type: string
          format: uri
        clientId:
          minLength: 1
          type: string
        emailDomains:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    OIDCFormPostView:
      type: object
      properties:
        tenantId:
          type: string
    Tenant:
      required:
      - id
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    CreateTenantRequest:
      required:
      - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
    LoginUserResponse:
      required:
      - id
      - token
      type: object
      properties:
        id:
          minLength: 1
          type: string
        tenants:
          uniqueItems: true
          type: array
          items:
            type: string
        token:
          $ref: '#/components/schemas/Token'
    Token:
      required:
      - id
      - jwt
      - type
      type: object
      properties:
        id:
          type: string
        jwt:
          minLength: 1
          type: string
        maxAge:
          minimum: 0
          type: integer
          format: int64
        type:
          type: string
          enum:
          - ACCESS_TOKEN
          - REFRESH_TOKEN
          - ID_TOKEN
    CreateBasicUserRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          minLength: 1
          type: string
          format: email
        password:
          minLength: 1
          type: string
        name:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        picture:
          type: string
        newTenant:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        tenants:
          uniqueItems: true
          type: array
          items:
            type: string
        email:
          type: string
        name:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        picture:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          minLength: 1
          type: string
          format: email
        password:
          minLength: 1
          type: string
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        picture:
          type: string
    LogicalDatabase:
      required:
      - id
      - placementStrategy
      - sharedPdb
      - status
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - REQUESTED
          - BUILT
          - POOLED
          - READY
        sharedPdb:
          $ref: '#/components/schemas/PhysicalDatabase'
        placementStrategy:
          type: string
          enum:
          - RANDOM
          - SINGLE
    PhysicalDatabase:
      required:
      - id
      - pdbId
      - regionId
      type: object
      properties:
        id:
          type: string
        regionId:
          type: integer
          format: int32
        pdbId:
          type: integer
          format: int32
    GetDatabaseStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - PENDING
          - REQUESTED
          - BUILT
          - POOLED
          - READY
    PrincipalResponse:
      type: object
      properties:
        id:
          type: string
        principalType:
          type: string
          enum:
          - DEVELOPER
          - USER
          - INTERNAL
        email:
          type: string
        name:
          type: string
    ComputeClaimView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        regionId:
          type: integer
          format: int32
        pdbId:
          type: integer
          format: int32
        host:
          type: string
        database:
          type: string
        created:
          type: string
        updated:
          type: string
        deleted:
          type: string
    InternalService:
      type: object
      properties:
        id:
          type: string
    DatabaseView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceSlug:
          type: string
        sharedRegion:
          type: integer
          format: int32
        sharedPdb:
          type: integer
          format: int32
        created:
          type: string
        updated:
          type: string
        deleted:
          type: string
    JsonNode:
      type: object
    OIDCProvider:
      required:
      - authType
      - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
        authType:
          type: string
          enum:
          - SSO
          - SOCIAL
        redirectUrl:
          type: string
          format: uri
        enabled:
          type: boolean
        configUrl:
          type: string
          format: uri
        config:
          $ref: '#/components/schemas/JsonNode'
        ttl_sec:
          type: integer
          format: int32
    OIDCRelyingParty:
      required:
      - clientId
      - clientSecret
      - provider
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        provider:
          type: string
        clientId:
          minLength: 1
          type: string
        clientSecret:
          minLength: 1
          type: string
        emailDomains:
          type: array
          items:
            type: string
        enabled:
          type: boolean
  securitySchemes:
    jwtBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
