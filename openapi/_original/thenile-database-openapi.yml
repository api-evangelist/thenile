  /databases/{databaseId}/auth/oidc/providers:
    get:
      tags:
      - authentication
      summary: List OIDC providers
      description: Lists all OIDC providers registered in the database.
      operationId: listOIDCProviders
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of OIDC providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OIDCProvider'
    post:
      tags:
      - authentication
      summary: Create OIDC provider
      description: "Creates an OIDC provider with the database. During creation, the\
        \ well-known configuration is loaded from the `configUrl` and stored in the\
        \ database. \nGoogle and Okta are supported out of the box. Use this endpoint\
        \ to register other OIDC providers."
      operationId: createOIDCProvider
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: The configuration for a new OIDC provider. A provider must have
          a unique name and a valid `configUrl` pointing to the well-known OIDC configuration.
          If the provider is enabled, the `redirectUrl` back to your application must
          be specified. (Without the `redirectUrl`, Nile cannot resolve authentication
          attempts.)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCProvider'
            examples:
              Create Social Provider:
                summary: Registers a new social login provider
                description: Create Social Provider
                value:
                  name: Some Social Host
                  authType: SOCIAL
                  enabled: true
                  configUrl: https://some-social-host.com/.well-known/openid-configuration
                  redirectUrl: https://myapp.com/auth/handler
              Create SSO Provider:
                summary: Registers a new SSO provider
                description: Create SSO Provider
                value:
                  name: Some SSO Host
                  authType: SSO
                  enabled: true
                  configUrl: https://some-sso-host.com/.well-known/openid-configuration
                  redirectUrl: https://myapp.com/auth/handler
      responses:
        '200':
          description: Updated OIDC provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProvider'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: OIDC provider already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '502':
          description: OIDC provider configuration does not match host URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
  /databases/{databaseId}/auth/oidc/providers/{providerName}:
    get:
      tags:
      - authentication
      summary: Get an OIDC provider
      description: Gets an OIDC provider by name. If the well-known config for the
        provider is determined to  have expired, the latest config is fetched and
        retained, ensuring that the provider information returned is always current.
      operationId: getOIDCProvider
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: providerName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OIDC provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProvider'
        '404':
          description: OIDC provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    put:
      tags:
      - authentication
      summary: Update OIDC provider
      description: Updates a named OIDC provider. During an update, the well-known
        configuration is refreshed.
      operationId: updateOIDCProvider
      parameters:
      - name: databaseId
        in: path
        required: true
        schema:
          type: string
      - name: providerName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: The new configuration values for an existing OIDC provider. (The
          `name` may not be modified.) If the provider is enabled, the `redirectUrl`
          back to your application must be specified. (Without the `redirectUrl`,
          Nile cannot resolve authentication attempts.)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCProvider'
            examples:
              Update Social Provider:
                summary: Updates the existing social provider configuration
                description: Update Social Provider
                value:
                  name: Some Social Host
                  authType: SOCIAL
                  enabled: true
                  configUrl: https://some-social-host.com/.well-known/openid-configuration
                  redirectUrl: https://myapp.com/auth/handler
              Update SSO Provider:
                summary: Updates the existing SSO provider configuration
                description: Update SSO Provider
                value:
                  name: Some SSO Host
                  authType: SSO
                  enabled: true
                  configUrl: https://some-sso-host.com/.well-known/openid-configuration
                  redirectUrl: https://myapp.com/auth/handler
      responses:
        '200':
          description: Updated OIDC provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCProvider'
        '400':
          description: OIDC provider name mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: OIDC provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
      security:
      - jwtBearerAuth: []
